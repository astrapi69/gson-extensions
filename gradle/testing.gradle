test {
    mustRunAfter(jar)
    useTestNG()
}

// The JaCoCo version, named so that a Gradle update does not change the measurement unnoticed (as
// astrapi69/jobj-core and astrapi69/silly-collection). 0.8.16 (2026-10-26) instead of the 0.8.15 Gradle 9.8.2
// brings, by the currency check before 4.1 (RL-120): the same numbers on the same tree with both
jacoco {
    toolVersion = '0.8.16'
}

jacocoTestReport {
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}

check.dependsOn jacocoTestReport
